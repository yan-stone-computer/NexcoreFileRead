name: test

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Install core test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install fastapi python-multipart "markitdown[pptx,docx,xlsx,xls,pdf,outlook]" pymupdf pillow
      - name: Run tests
        run: python -m unittest discover -s tests -v
